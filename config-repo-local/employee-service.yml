server:
  port: 8081

spring:
  application:
    name: employee-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-db:3306/internhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
jwt:
  secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 giờ tính bằng milliseconds

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

backup:
  storage-dir: ${BACKUP_DIR:/backups}
  cron: ${BACKUP_CRON:0 0 2 * * ?}
  retention-days: ${BACKUP_RETENTION_DAYS:30}
  mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
