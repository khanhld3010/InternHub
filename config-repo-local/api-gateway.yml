server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:internhub-redis-broker}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            - name: SetResponseHeader
              args:
                name: X-Frame-Options
                value: DENY
            - name: SetResponseHeader
              args:
                name: X-Content-Type-Options
                value: nosniff
            - name: SetResponseHeader
              args:
                name: X-XSS-Protection
                value: 1; mode=block
            - name: SetResponseHeader
              args:
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
            - name: SetResponseHeader
              args:
                name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http: https:; connect-src 'self' ws: wss: http: https:;"
          routes:
            # 1. Identity and Access Service (Auth, Users, IAM)
            - id: identity-auth
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: identity-users
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/users, /api/users/**

            - id: identity-system-roles
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/system/roles, /api/system/roles/**

            - id: identity-system-permissions
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/system/permissions, /api/system/permissions/**

            - id: identity-system-users
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/system/users, /api/system/users/**

            # 2. Intern and Program Service (Interns, Documents)
            # Route cũ tương thích ngược: /api/employees/interns/** -> /api/interns/**
            - id: intern-legacy-compat
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/employees/interns, /api/employees/interns/**
              filters:
                - RewritePath=/api/employees/interns(?<segment>/?.*), /api/interns$\{segment}

            - id: intern-and-program-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/interns, /api/interns/**

            - id: program-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/programs, /api/programs/**

            - id: department-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/departments, /api/departments/**

            - id: onboarding-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/onboarding, /api/onboarding/**

            # 3. Reporting and Integration Service (Backup TM-8, Audit Log TM-9)
            - id: reporting-backups
              uri: lb://reporting-and-integration-service
              predicates:
                - Path=/api/system/backups, /api/system/backups/**

            - id: reporting-audit-logs
              uri: lb://reporting-and-integration-service
              predicates:
                - Path=/api/system/audit-logs, /api/system/audit-logs/**

            # 4. Notification Service (WebSocket & Notifications REST)
            - id: notification-internal-block
              uri: no://op
              predicates:
                - Path=/api/notifications/internal, /api/notifications/internal/**
              filters:
                - SetStatus=403

            - id: notification-ws
              uri: lb:ws://notification-service
              predicates:
                - Path=/ws/**

            - id: notification-rest
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications, /api/notifications/**

            # 5. Identity fallback cho /api/employees/**
            - id: identity-employees
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/employees/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO
