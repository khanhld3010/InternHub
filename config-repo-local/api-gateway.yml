server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: employee-service
              uri: lb://employee-service
              predicates:
                - Path=/api/employees/**
            - id: employee-service-auth
              uri: lb://employee-service
              predicates:
                - Path=/api/auth/**
            - id: employee-service-system
              uri: lb://employee-service
              predicates:
                - Path=/api/system/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: DEBUG
