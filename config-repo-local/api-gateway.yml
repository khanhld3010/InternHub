server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:internhub-redis-broker}}
      port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      timeout: 2000ms
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # 1. Identity and Access Service (Auth, Users, IAM)
            - id: identity-auth
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: identity-users
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/users, /api/users/**

            - id: identity-system-roles
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/system/roles, /api/system/roles/**

            - id: identity-system-permissions
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/system/permissions, /api/system/permissions/**

            - id: identity-system-users
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/system/users, /api/system/users/**

            # 2. Intern and Program Service (Interns, Documents)
            # Route cũ tương thích ngược: /api/employees/interns/** -> /api/interns/**
            - id: intern-legacy-compat
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/employees/interns, /api/employees/interns/**
              filters:
                - RewritePath=/api/employees/interns(?<segment>/?.*), /api/interns$\{segment}

            - id: intern-and-program-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/interns, /api/interns/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 15
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: program-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/programs, /api/programs/**

            - id: department-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/departments, /api/departments/**

            - id: onboarding-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/onboarding, /api/onboarding/**

            - id: mentor-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/mentor, /api/mentor/**, /api/mentors, /api/mentors/**, /api/v1/mentor, /api/v1/mentor/**

            - id: evaluation-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/evaluations, /api/evaluations/**
            # Route cho phân hệ Chấm công TM-25
            - id: attendance-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/v1/attendances, /api/v1/attendances/**

            # Route cho phân hệ Nghỉ phép TM-28
            - id: leave-request-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/v1/leave-requests, /api/v1/leave-requests/**

            # Route cho phân hệ Hợp đồng điện tử động
            - id: dynamic-contract-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/v1/contracts, /api/v1/contracts/**, /api/v1/contract-templates, /api/v1/contract-templates/**

            - id: mission-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/mission-boards, /api/mission-boards/**, /api/mission-items, /api/mission-items/**, /api/intern/mission-items, /api/intern/mission-items/**

            # Route cho Lịch họp & Thông báo
            - id: meeting-schedule-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/v1/meetings, /api/v1/meetings/**

            # Route cho phân hệ Phụ cấp C4
            - id: allowance-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/v1/allowances, /api/v1/allowances/**

            # Route cho phân hệ Yêu cầu hỗ trợ C4
            - id: support-request-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/v1/support-requests, /api/v1/support-requests/**

            # Route cho phân hệ AI Quiz TM-104
            - id: quiz-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/quizzes, /api/quizzes/**

            # 3. Reporting and Integration Service (Backup TM-8, Audit Log TM-9)
            - id: reporting-backups
              uri: lb://reporting-and-integration-service
              predicates:
                - Path=/api/system/backups, /api/system/backups/**

            - id: reporting-audit-logs
              uri: lb://reporting-and-integration-service
              predicates:
                - Path=/api/system/audit-logs, /api/system/audit-logs/**

            # 4. Notification Service (WebSocket & Notifications REST)
            - id: notification-internal-block
              uri: no://op
              predicates:
                - Path=/api/notifications/internal, /api/notifications/internal/**
              filters:
                - SetStatus=403

            - id: notification-ws
              uri: lb:ws://notification-service
              predicates:
                - Path=/ws/**

            - id: notification-rest
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications, /api/notifications/**

            # 5. File Service (Actuator Health Probe – bảo vệ bởi file-service SecurityFilterChain)
            - id: file-actuator
              uri: lb://file-service
              predicates:
                - Path=/api/files/actuator/**
              filters:
                - RewritePath=/api/files/actuator(?<segment>/?.*), /actuator${segment}

            # 6. Identity fallback cho /api/employees/**
            - id: identity-employees
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/employees/**

            # 7. AI Service (Chatbot, Screening & AI Modules)
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai, /api/ai/**, /api/v1/ai, /api/v1/ai/**



eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO
