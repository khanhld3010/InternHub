server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # 1. Identity and Access Service (Auth, Users, IAM)
            - id: identity-auth
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/auth/**

            - id: identity-users
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/users/**

            # 2. Intern and Program Service (Interns, Documents)
            # Route cũ tương thích ngược: /api/employees/interns/** -> /api/interns/**
            - id: intern-legacy-compat
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/employees/interns/**
              filters:
                - RewritePath=/api/employees/interns(?<segment>/?.*), /api/interns$\{segment}

            - id: intern-and-program-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/interns/**

            - id: program-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/programs/**

            - id: department-service
              uri: lb://intern-and-program-service
              predicates:
                - Path=/api/departments/**

            # 3. Reporting and Integration Service (Backup TM-8, Audit Log TM-9)
            - id: reporting-backups
              uri: lb://reporting-and-integration-service
              predicates:
                - Path=/api/system/backups/**

            - id: reporting-audit-logs
              uri: lb://reporting-and-integration-service
              predicates:
                - Path=/api/system/audit-logs/**

            # 4. Identity fallback cho /api/employees/**
            - id: identity-employees
              uri: lb://identity-and-access-service
              predicates:
                - Path=/api/employees/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO
