server:
  port: 8083

spring:
  application:
    name: reporting-and-integration-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-db:3306/internhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply.internhub@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    company-name: ${COMPANY_NAME:InternHub Technology}
    support-email: ${SUPPORT_EMAIL:support@internhub.com}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    mock-mode: ${MAIL_MOCK_MODE:true}
  intern-service:
    url: ${INTERN_SERVICE_URL:http://intern-and-program-service:8082}

jwt:
  secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

backup:
  storage-dir: ${BACKUP_DIR:/backups}
  cron: ${BACKUP_CRON:0 0 2 * * ?}
  retention-days: ${BACKUP_RETENTION_DAYS:30}
  mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
