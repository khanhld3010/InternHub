server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${AI_DB_NAME:ai_service_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

ai:
  encryption:
    current-version: 1
    # 32-byte Base64 key for AES-256-GCM. Override via AI_ENCRYPTION_KEY_V1 env var
    key-v1: ${AI_ENCRYPTION_KEY_V1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  gemini:
    base-url: https://generativelanguage.googleapis.com
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  intern-service:
    url: http://${INTERN_SERVICE_HOST:intern-and-program-service}:8082

app:
  notification-service:
    url: http://${NOTIFICATION_SERVICE_HOST:notification-service}:8085
    internal-token: ${INTERNAL_SERVICE_TOKEN:internhub-internal-secret-token-2026}

services:
  intern-service:
    url: http://${INTERN_SERVICE_HOST:intern-and-program-service}:8082

# AI-20: Resilience4j Circuit Breaker & TimeLimiter Configuration
resilience4j:
  circuitbreaker:
    instances:
      geminiClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 12000ms
        wait-duration-in-open-state: 30000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.RestClientResponseException
          - java.net.http.HttpTimeoutException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      geminiClient:
        timeout-duration: 15000ms
        cancel-running-future: true
