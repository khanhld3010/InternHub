server:
  port: 8081

spring:
  application:
    name: identity-and-access-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-db:3306/internhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:900000} # 15 phút tính bằng milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 ngày tính bằng milliseconds

app:
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
