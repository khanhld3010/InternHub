services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: internhub_db
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - micro-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build: ./config-server
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SPRING_PROFILES_ACTIVE: "native"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:///config-repo-local"
    volumes:
      - ./config-repo-local:/config-repo-local
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SERVER_PORT: 8761
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  identity-and-access-service:
    build: ./identity-and-access-service
    container_name: identity-and-access-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-mock-google-client-id}
    ports:
      - "8081:8081"
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  intern-and-program-service:
    build: ./intern-and-program-service
    container_name: intern-and-program-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    ports:
      - "8082:8082"
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    volumes:
      - ./data/uploads:/uploads
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reporting-and-integration-service:
    build: ./reporting-and-integration-service
    container_name: reporting-and-integration-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply.internhub@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_MOCK_MODE: ${MAIL_MOCK_MODE:-true}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      COMPANY_NAME: ${COMPANY_NAME:-InternHub Technology}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@internhub.com}
    ports:
      - "8083:8083"
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    volumes:
      - ./data/backups:/backups
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------
  # File Service (Object Storage Utility - infra/object-storage-minio-s3)
  # -------------------------------------------------------------
  file-service:
    build: ./file-service
    container_name: file-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-internhub_app_client}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-InternHubAppSecret2026Secure}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-internhub-documents}
      STORAGE_INTERNAL_ENDPOINT: "http://internhub-s3-storage:9090"
      STORAGE_PUBLIC_ENDPOINT: "http://localhost:9090"
      EUREKA_URI: "http://discovery-server:8761/eureka/"
    depends_on:
      discovery-server:
        condition: service_healthy
      s3-storage:
        condition: service_healthy
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # -------------------------------------------------------------
  # S3 Object Storage Server (AWS S3 Compatible - infra/object-storage-minio-s3)
  # -------------------------------------------------------------
  s3-storage:
    image: adobe/s3mock:latest
    container_name: internhub-s3-storage
    restart: unless-stopped
    ports:
      - "9090:9090"   # HTTP S3 API Endpoint
      - "9191:9191"   # HTTPS S3 API Endpoint
    environment:
      initialBuckets: ${STORAGE_BUCKET_NAME:-internhub-documents}
      retainFilesOnExit: "true"
      root: /data
    volumes:
      - s3_storage_data:/data
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health 2>&1 || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis Message Broker (Real-time Pub/Sub & Revocation Storage)
  # -------------------------------------------------------------
  redis-broker:
    image: redis:alpine
    container_name: internhub-redis-broker
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - micro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Notification Service (WebSocket STOMP & Push Notifications)
  # -------------------------------------------------------------
  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      REDIS_HOST: redis-broker
      REDIS_PORT: 6379
      DB_URL: "jdbc:mysql://mysql-db:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      EUREKA_URI: "http://discovery-server:8761/eureka/"
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  micro-network:
    driver: bridge

volumes:
  s3_storage_data:
    driver: local
  redis_data:
    driver: local


